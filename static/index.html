<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MBA Portfolio Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 25px; padding: 10px 20px; background: #222; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h1>MBA Portfolio Analyzer</h1>
  <form id="profileForm">

    <label>Specialization Interest</label>
    <select id="specialization_interest">
      <option value="finance">Finance</option>
      <option value="marketing">Marketing</option>
      <option value="consulting">Consulting</option>
      <option value="operations">Operations</option>
      <option value="entrepreneurship">Entrepreneurship</option>
    </select>

    <label>Class 10 Percentage</label>
    <input type="number" id="class_10_percent" placeholder="e.g. 85">

    <label>Class 12 Percentage</label>
    <input type="number" id="class_12_percent" placeholder="e.g. 88">

    <label>Graduation Percentage / CGPA</label>
    <input type="number" id="graduation_percent" placeholder="e.g. 75">

    <label>Graduation Stream</label>
    <input type="text" id="graduation_stream" placeholder="e.g. Computer Science">

    <label>Entrance Exam</label>
    <select id="exam_name">
      <option value="CAT">CAT</option>
      <option value="XAT">XAT</option>
      <option value="GMAT">GMAT</option>
      <option value="SNAP">SNAP</option>
      <option value="CMAT">CMAT</option>
    </select>

    <label>Exam Percentile</label>
    <input type="number" id="percentile" placeholder="e.g. 92">

    <label>Work Experience (years)</label>
    <input type="number" step="0.1" id="work_years" placeholder="e.g. 1.5">

    <label>Work Experience Domain</label>
    <input type="text" id="work_domain" placeholder="e.g. IT / Software">

    <button type="submit">Submit</button>
  </form>

  <pre id="result"></pre>

  <script>
    document.getElementById("profileForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const profile = {
        specialization_interest: document.getElementById("specialization_interest").value,
        academics: {
          class_10_percent: Number(document.getElementById("class_10_percent").value),
          class_12_percent: Number(document.getElementById("class_12_percent").value),
          graduation_percent: Number(document.getElementById("graduation_percent").value),
          graduation_stream: document.getElementById("graduation_stream").value
        },
        entrance_exam: {
          exam_name: document.getElementById("exam_name").value,
          percentile: Number(document.getElementById("percentile").value)
        },
        work_experience: {
          years: Number(document.getElementById("work_years").value),
          domain: document.getElementById("work_domain").value
        }
      };

    fetch("/submit-profile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(profile)
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("result").textContent = JSON.stringify(data, null, 2);
      })
      .catch(error => {
        document.getElementById("result").textContent = "Error: " + error;
      });
    });
  </script>

</body>
</html>
